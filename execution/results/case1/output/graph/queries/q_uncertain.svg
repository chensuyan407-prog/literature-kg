<path d="M706,190 L364,112" stroke="#d62728" stroke-width="0.8" fill="none" opacity="0.55" stroke-dasharray="4,3"><title>ATTRIBUTED_TO [paper-B p-0090] the graphene-like aromatic domains of rGO may promote π–π interactions with the aromatic ring of phenol</title></path>

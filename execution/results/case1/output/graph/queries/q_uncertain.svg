<path d="M46,60 Q209.5,99.0 46,138" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>HAS_RESULT [paper-A p-0059] The experimental data for all acids exhibited an excellent fit with the PSO model (R 2 &gt; 0.99)</title></path>
<path d="M46,60 Q216.0,112.0 46,164" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>HAS_RESULT [paper-A p-0059] The rate constants (k 2) were determined as 0.007, 0.0023, and 0.0019 g/mg·min</title></path>
<path d="M46,60 Q222.5,125.0 46,190" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>HAS_RESULT [paper-A p-0063] R L values for all investigated acids on both adsorbents across the studied concentration range (10–100 g/L) were between 2.3 × 10–6 and 2.8 × 10–3</title></path>
<path d="M46,112 L364,86" stroke="#d62728" stroke-width="0.8" fill="none" opacity="0.55" stroke-dasharray="4,3"><title>ATTRIBUTED_TO [paper-A p-0065] which may facilitate supplementary hydrogen bonding interactions with the oxygen-functionalized graphene oxide surface</title></path>
<path d="M376,60 L34,216" stroke="#d62728" stroke-width="0.8" fill="none" opacity="0.55" stroke-dasharray="4,3"><title>SUPPORTS [paper-A p-0069] While the Langmuir model demonstrated excellent agreement (R 2 &gt; 0.95), suggesting predominantly monolayer adsorption on a homogeneous distribution of active sites</title></path>
<path d="M46,86 Q229.0,164.0 46,242" stroke="#d62728" stroke-width="0.8" fill="none" opacity="0.55" stroke-dasharray="4,3"><title>UNDER_CONDITION [paper-A p-0015] The spent adsorbent was then treated with 0.1 M NaOH as a desorption agent</title></path>
<path d="M706,60 Q856.5,73.0 706,86" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>PREPARED_FROM [paper-B p-0016] After stabilization of the system, reduced graphene oxide was introduced into the suspension.</title></path>
<path d="M706,60 Q876.0,112.0 706,164" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>USES [paper-B p-0015] The composite was synthesized by ultrasonic treatment in an aqueous medium.</title></path>
<path d="M706,60 Q863.0,86.0 706,112" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>CHARACTERIZED_BY [paper-B p-0018] The elemental composition of the samples was determined using an Elementar Unicube elemental analyzer</title></path>
<path d="M706,60 Q869.5,99.0 706,138" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>CHARACTERIZED_BY [paper-B p-0020] The content of oxygen-containing functional groups was determined by selective chemical binding followed by titrimetric analysis.</title></path>
<path d="M706,60 Q856.5,73.0 706,86" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-B p-0089] the HA-rGO composite exhibited a higher adsorption capacity toward phenol than the initial humic acid and rGO</title></path>
<path d="M706,86 Q882.5,151.0 706,216" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>HAS_RESULT [paper-B p-0093] For rGO, the Langmuir and Freundlich models showed comparable agreement with the experimental data</title></path>
<path d="M706,86 Q889.0,164.0 706,242" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>HAS_RESULT [paper-B p-0099] The pseudo-first-order model exhibited a marginally higher R2 value of 0.9973 compared with 0.9968 for the pseudo-second-order model.</title></path>
<path d="M706,294 Q863.0,320.0 706,346" stroke="#d62728" stroke-width="0.8" fill="none" opacity="0.55" stroke-dasharray="4,3"><title>INVOLVES [paper-B p-0081] This suggests that composite formation occurs mainly through non-covalent interactions between the components.</title></path>

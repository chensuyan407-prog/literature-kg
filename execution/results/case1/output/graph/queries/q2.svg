<text x="20" y="20" font-size="14" font-weight="bold">q2: Which isotherm / kinetic models fit each paper&#x27;s data, and which model won under which sample?</text>
<text x="40" y="44" font-size="12" font-weight="bold" fill="#333">paper paper-A</text>
<text x="370" y="44" font-size="12" font-weight="bold" fill="#333">concepts in &gt;=2 papers (one node, per-paper edges)</text>
<text x="700" y="44" font-size="12" font-weight="bold" fill="#333">paper paper-B</text>
<path d="M46,164 Q196.5,151.0 46,138" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-A p-0045] These results clearly establish that the MGO composite provides a vastly superior affinity and saturation capacity for succinic acid recovery compared to the AC reference.</title></path>
<path d="M46,164 Q196.5,151.0 46,138" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-A p-0040] its maximum adsorption capacity for lactic acid was substantially lower (q max = 74.6 mg/g)</title></path>
<path d="M46,138 Q196.5,151.0 46,164" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-A p-0051] specifically below approximately 3 g/L, the activated carbon-based adsorbent exhibits a slightly higher adsorption capacity than the MGO composite</title></path>
<path d="M376,138 L34,242" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-A p-0059] The experimental data for all acids exhibited an excellent fit with the PSO model (R 2 &gt; 0.99)</title></path>
<path d="M376,112 L34,164" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-A p-0046] Both AC- and graphene oxide-based samples exhibit good agreement with the Langmuir isotherm model.</title></path>
<path d="M376,112 L34,138" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-A p-0046] Both AC- and graphene oxide-based samples exhibit good agreement with the Langmuir isotherm model.</title></path>
<path d="M46,190 Q209.5,229.0 46,268" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-A p-0056] the Temkin model provided a satisfactory fit for all investigated organic acids</title></path>
<path d="M376,86 L34,216" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-A p-0054] Specifically, for lactic acid on MGO, the high correlation coefficient (R 2 = 0.826)</title></path>
<path d="M46,190 Q196.5,203.0 46,216" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-A p-0056] The high correlation with the Temkin model (R 2 = 0.826 for lactic acid)</title></path>
<path d="M46,164 Q216.0,112.0 46,60" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>COMPARED_WITH [paper-A p-0038] Unlike activated carbon, graphene oxide possesses a layered graphitic framework rich in oxygen-containing functional groups</title></path>
<path d="M46,112 Q196.5,99.0 46,86" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>COMPARED_WITH [paper-A p-0060] The lowest k 2 value observed for citric acid (0.0019 g/mg·min) is quantitatively consistent with its bulky tricarboxylic structure</title></path>
<path d="M706,86 Q856.5,99.0 706,112" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-B p-0089] the HA-rGO composite exhibited a higher adsorption capacity toward phenol than the initial humic acid and rGO</title></path>
<path d="M706,86 Q863.0,112.0 706,138" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-B p-0089] the HA-rGO composite exhibited a higher adsorption capacity toward phenol than the initial humic acid and rGO</title></path>
<path d="M376,112 L694,216" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-B p-0094] phenol adsorption on the HA–rGO composite was better described by the Langmuir model, with R2 = 0.9804</title></path>
<path d="M376,112 Q526.5,99.0 376,86" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-B p-0094] phenol adsorption on the HA–rGO composite was better described by the Langmuir model, with R2 = 0.9804, whereas the Freundlich model gave R2 = 0.9515</title></path>
<path d="M376,86 Q526.5,99.0 376,112" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-B p-0092] The adsorption of phenol on HA was better described by the Freundlich model</title></path>
<path d="M376,86 L694,190" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-B p-0092] for which the coefficient of determination was R2 = 0.9092, compared with R2 = 0.8502 for the Langmuir model</title></path>
<path d="M376,112 Q526.5,99.0 376,86" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>COMPARED_WITH [paper-B p-0093] neither model can be considered unambiguously predominant for rGO within the investigated concentration range</title></path>
<path d="M376,138 L694,242" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-B p-0098] The pseudo-second-order model also showed better agreement for the HA–rGO composite</title></path>
<path d="M376,138 L694,164" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-B p-0100] the kinetic data for HA and HA–rGO were better described by the pseudo-second-order model</title></path>
<path d="M706,164 L364,138" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>COMPARED_WITH [paper-B p-0100] whereas both models provided a comparable fit for rGO</title></path>
<path d="M706,60 L364,60" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>COMPARED_WITH [paper-B p-0034] These results indicate substantial removal of oxygen-containing groups compared with graphene oxide</title></path>

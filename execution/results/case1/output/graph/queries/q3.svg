<text x="20" y="20" font-size="14" font-weight="bold">q3: What does each paper say about the pseudo-second-order kinetic model?</text>
<text x="40" y="44" font-size="12" font-weight="bold" fill="#333">paper paper-A</text>
<text x="370" y="44" font-size="12" font-weight="bold" fill="#333">concepts in &gt;=2 papers (one node, per-paper edges)</text>
<text x="700" y="44" font-size="12" font-weight="bold" fill="#333">paper paper-B</text>
<path d="M376,60 L34,86" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-A p-0059] The experimental data for all acids exhibited an excellent fit with the PSO model (R 2 &gt; 0.99)</title></path>
<path d="M46,60 Q196.5,73.0 46,86" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>HAS_RESULT [paper-A p-0059] The experimental data for all acids exhibited an excellent fit with the PSO model (R 2 &gt; 0.99)</title></path>
<path d="M46,86 Q196.5,99.0 46,112" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>SUPPORTS [paper-A p-0059] This confirms that the adsorption rate is governed by chemical interactions (chemisorption).</title></path>
<path d="M376,60 L694,86" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>FITS [paper-B p-0098] The pseudo-second-order model also showed better agreement for the HA–rGO composite</title></path>
<path d="M376,60 L694,60" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>OUTPERFORMS [paper-B p-0100] the kinetic data for HA and HA–rGO were better described by the pseudo-second-order model</title></path>
<path d="M706,60 L364,60" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>COMPARED_WITH [paper-B p-0100] whereas both models provided a comparable fit for rGO</title></path>
<path d="M706,86 Q863.0,112.0 706,138" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>UNDER_CONDITION [paper-B p-0031] Kinetic experiments were performed at an initial phenol concentration of 7.5 mg/dm3.</title></path>
<path d="M706,86 Q856.5,99.0 706,112" stroke="#999" stroke-width="0.8" fill="none" opacity="0.55"><title>CONTRADICTS [paper-B p-0100] These models should be regarded as empirical descriptions of the adsorption-rate data</title></path>
